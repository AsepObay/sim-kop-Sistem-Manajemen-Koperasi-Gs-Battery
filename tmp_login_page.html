  <style>
    html, body {
      margin: 0;
      min-height: 100vh;
      height: 100%;
      overflow: hidden;
      font-family: "Public Sans", sans-serif;
      background: linear-gradient(135deg, rgba(157, 35, 35, 0.75), rgba(24, 24, 24, 0.55));
    }

    body {
      position: relative;
      min-height: 100vh;
      overflow: hidden;
      background-color: #111827;
    }

    .login-bg-video {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 0;
      display: block;
      opacity: 1;
      filter: none;
      backdrop-filter: none;
      transform: none;
      background: transparent;
    }

    .login-bg-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0);
      z-index: 1;
      pointer-events: none;
      opacity: 1;
    }

    .auth-main {
      position: relative;
      z-index: 2;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .auth-wrapper.v3 {
      position: relative;
      z-index: 2;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .auth-form {
      position: relative;
      z-index: 2;
      width: min(100%, 430px);
    }

    .auth-main .auth-wrapper.v3 .auth-form:after {
      display: none !important;
      background: transparent !important;
      backdrop-filter: none !important;
      -webkit-backdrop-filter: none !important;
      filter: none !important;
      content: none !important;
    }

    .login-card {
      position: relative;
      z-index: 2;
      margin: 0;
      border-radius: 24px;
      background: rgba(255,255,255,0.92);
      border: 1px solid rgba(255,255,255,0.8);
      box-shadow: 0 12px 40px rgba(15, 23, 42, 0.12);
      overflow: hidden;
    }

    .login-card .card-body {
      padding: 32px;
    }

    /* Logo */
    .simkop-logo {
      width: 120px;
      height: auto;
      display: block;
      margin: 0 auto 6px;
      image-rendering: -webkit-optimize-contrast;
    }

    /* Header */
    .login-heading {
      font-size: 28px;
      font-weight: 700;
      margin: 0;
      color: #1F2937;
      line-height: 1;
    }

    .login-subtitle {
      margin: 8px 0 6px;
      color: #6B7280;
      font-size: 14px;
    }

    .login-accent {
      width: 56px;
      height: 4px;
      background: #DC2626;
      border-radius: 4px;
      margin: 6px auto 0;
      opacity: 0.95;
    }

    /* Inputs */
    .custom-input {
      height: 46px;
      border-radius: 10px;
      background: #ffffff;
      border: 1px solid #E6EEF6;
      padding: 0 14px;
      box-shadow: none;
      font-size: 15px;
      color: #111827;
      transition: border-color 150ms ease, box-shadow 150ms ease;
    }

    .custom-input:focus {
      border-color: #2563EB;
      box-shadow: 0 6px 18px rgba(37,99,235,0.06);
      outline: none;
    }

    .password-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .password-toggle {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 46px;
      height: 46px;
      padding: 0;
      border-radius: 10px;
      border: 1px solid #D9E0EA;
      background: transparent;
      color: #374151;
      cursor: pointer;
    }

    .password-toggle:hover {
      background: rgba(37,99,235,0.04);
    }

    /* Checkbox */
    .form-check-input {
      width: 18px;
      height: 18px;
      border-radius: 4px;
      border: 1px solid #D9E0EA;
      background: #fff;
      margin-top: 2px;
      vertical-align: middle;
    }

    .form-check-input:checked {
      background-color: #2563EB;
      border-color: #2563EB;
    }

    .form-check-label {
      margin-left: 8px;
      color: #6B7280;
      font-size: 14px;
      vertical-align: middle;
    }

    /* Login button */
    .login-button {
      position: relative;
      overflow: hidden;
      background: linear-gradient(135deg, #38bdf8 0%, #2563eb 45%, #1d4ed8 100%);
      border-radius: 10px;
      height: 48px;
      color: #ffffff;
      font-weight: 600;
      border: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 20px rgba(37, 99, 235, 0.12);
      transition: transform 160ms ease, box-shadow 160ms ease;
    }

    .login-button::before {
      content: "";
      position: absolute;
      top: 0;
      left: -120%;
      width: 60%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.45), transparent);
      transform: skewX(-20deg);
      transition: left 0.9s ease;
      pointer-events: none;
    }

    .login-button:hover::before {
      left: 120%;
    }

    /* subtle glossy on hover */
    .login-button::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(255,255,255,0.06), rgba(255,255,255,0));
      opacity: 0;
      transition: opacity 220ms ease;
      pointer-events: none;
    }

    .login-button:hover::after {
      opacity: 1;
    }

    .login-button:hover {
      transform: translateY(-1px);
      box-shadow: 0 12px 26px rgba(37, 99, 235, 0.16);
    }

    /* Spacing adjustments */
    .login-header-wrap { padding-bottom: 6px; }

    @media (max-width: 768px) {
      .auth-form { width: min(100%, 92vw); }
      .login-card .card-body { padding: 24px; }
      .simkop-logo { width: 120px; }
    }

    @media (max-width: 420px) {
      .auth-form { width: calc(100% - 24px); }
      .login-card .card-body { padding: 20px; }
      .simkop-logo { width: 110px; }
    }

    .auth-footer {
      position: relative;
      z-index: 2;
      margin-top: 12px;
      color: #f8fafc;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.25);
    }

    .auth-footer a {
      color: #fff;
    }

    @media (max-width: 768px) {
      html, body {
        overflow: auto;
      }

      body {
        min-height: 100vh;
      }

      .auth-main {
        padding: 16px;
      }

      .auth-form {
        width: min(100%, 92vw);
      }

      .login-card {
        border-radius: 18px;
      }
    }
  </style>

  <script>
    document.addEventListener('DOMContentLoaded', function () {
      const passwordInput = document.getElementById('passwordInput');
      const togglePassword = document.getElementById('togglePassword');
      const togglePasswordIcon = document.getElementById('togglePasswordIcon');

      if (!passwordInput || !togglePassword || !togglePasswordIcon) {
        return;
      }

      togglePassword.addEventListener('click', function () {
        const isPassword = passwordInput.getAttribute('type') === 'password';
        passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
        togglePasswordIcon.className = isPassword ? 'ti ti-eye-off' : 'ti ti-eye';
      });
    });
  </script>
